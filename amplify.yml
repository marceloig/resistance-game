version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use Node 22 to match the lockfileVersion 3 generated by npm 11
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - 'node_modules/**/*'
